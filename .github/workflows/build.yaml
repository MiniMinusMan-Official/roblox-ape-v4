name: Validate source layout

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify split source layout
        run: |
          test -f 'src/games/universal - base/base.lua'
          test -f 'src/guis/new/gui.lua'
          test -f 'src/guis/new/components/Toggle.lua'
          test ! -e 'src/games/universal.lua'
          test ! -e 'src/guis/new.lua'
