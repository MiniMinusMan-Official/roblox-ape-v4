name: Validate runtime bundles

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild runtime bundles
        run: node build-universal.mjs

      - name: Verify generated bundles are current
        run: git diff --exit-code -- src/games/universal.lua src/guis/new.lua src/guis/old.lua src/guis/rise.lua src/guis/liquidbounce.lua src/guis/wurst.lua
