name: Validate source bundle

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild universal source bundle
        run: node build-universal.mjs

      - name: Verify generated bundle is current
        run: git diff --exit-code -- src/games/universal.lua
